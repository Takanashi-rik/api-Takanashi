<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Halaman login Takanashi-API">
    <meta name="theme-color" content="#1a202c">
    <title>Login - Takanashi-API</title>
    <link rel="icon" href="/assets/icon.png" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        'mono': ['Ubuntu Mono', 'monospace'],
                        'sans': ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            display: none !important;
        }
        .glass {
            backdrop-filter: blur(16px) saturate(180%);
            background: rgba(23, 25, 35, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.125);
        }
        .gradient-text {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
        }
        .btn-gradient:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        input:focus {
            outline: none;
            border-color: #6366f1 !important;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
        .error-input {
            border-color: #ef4444 !important;
        }
        .error-text {
            color: #ef4444;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }
        .error-text.show {
            display: block;
        }
        .loader {
            width: 20px;
            height: 20px;
            border: 2px solid #4a5568;
            border-top: 2px solid #e2e8f0;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        input[type="checkbox"] {
            accent-color: #6366f1;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        #notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-120%);
            opacity: 0;
            z-index: 9999;
            width: auto;
            min-width: 280px;
            max-width: 420px;
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55), opacity 0.5s ease;
        }
        #notification.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        #notification.hide {
            transform: translateX(-50%) translateY(-120%);
            opacity: 0;
        }
        .notification-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-left: 4px solid #6366f1;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            padding: 14px 20px;
            border-radius: 10px;
        }
        .notification-content .flex {
            gap: 10px;
        }
        .notification-content .w-10.h-10 {
            width: 36px;
            height: 36px;
        }
        .notification-content .w-10.h-10 .material-icons {
            font-size: 18px;
        }
        .notification-content #notifTitle {
            font-size: 13px;
        }
        .notification-content #notifMessage {
            font-size: 12px;
        }
        .notification-content button .material-icons {
            font-size: 16px;
        }
        .notification-progress {
            height: 2.5px;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            width: 100%;
            animation: progressShrink 3s linear forwards;
            border-radius: 0 0 10px 10px;
            margin-top: 10px;
        }
        @keyframes progressShrink {
            from { width: 100%; }
            to { width: 0%; }
        }
        .btn-back {
            background: rgba(23, 25, 35, 0.8);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #6366f1;
            transition: all 0.3s ease;
        }
        .btn-back:hover {
            background: rgba(23, 25, 35, 0.9);
            border-color: rgba(99, 102, 241, 0.5);
            transform: translateY(-1px);
        }
        .password-wrapper {
            position: relative;
        }
        .password-wrapper input {
            padding-right: 45px;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 5px;
            transition: color 0.3s;
        }
        .toggle-password:hover {
            color: #e2e8f0;
        }
    </style>
</head>
<body class="bg-gray-900 text-slate-300 antialiased font-mono min-h-screen flex items-center justify-center">

    <div id="notification">
        <div class="notification-content">
            <div class="flex items-start">
                <div class="flex-shrink-0">
                    <div class="w-10 h-10 rounded-full bg-indigo-500/20 flex items-center justify-center">
                        <span class="material-icons text-indigo-400">check_circle</span>
                    </div>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="font-semibold text-white" id="notifTitle" style="font-size: 13px;">Login Berhasil!</p>
                    <p class="text-slate-400 mt-0.5" id="notifMessage" style="font-size: 12px;">Selamat datang kembali, User!</p>
                </div>
                <button onclick="closeNotification()" class="flex-shrink-0 text-slate-500 hover:text-slate-300 transition-colors">
                    <span class="material-icons" style="font-size: 16px;">close</span>
                </button>
            </div>
            <div class="notification-progress"></div>
        </div>
    </div>

    <main class="max-w-md w-full mx-auto px-6 py-12">

        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
                <img src="/assets/icon.png" class="w-10">
                <h1 class="text-2xl font-bold gradient-text">Takanashi-API</h1>
            </div>
            <a href="/" class="btn-back px-3 py-1.5 text-xs font-medium rounded-lg flex items-center gap-1">
                <i class="fas fa-arrow-left text-xs"></i>
                Home
            </a>
        </div>

        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-white">Masuk</h2>
            <p class="text-slate-400 text-sm mt-1">Masuk ke akun Anda</p>
        </div>

        <div class="glass rounded-xl p-8">
            <form id="loginForm" novalidate>

                <div class="mb-5">
                    <label class="block text-xs font-medium text-slate-400 mb-2">
                        <i class="fas fa-user mr-2 text-xs"></i>
                        Username atau Email
                    </label>
                    <input 
                        type="text" 
                        id="usernameOrEmail" 
                        placeholder="Masukkan username atau email" 
                        class="w-full px-4 py-3 text-sm border border-gray-700 bg-gray-800/50 text-slate-300 placeholder-slate-500 focus:border-indigo-500 transition-colors duration-150 rounded-lg"
                        required
                    >
                    <div class="error-text" id="usernameOrEmailError">Username atau email harus diisi</div>
                </div>

                <div class="mb-5">
                    <label class="block text-xs font-medium text-slate-400 mb-2">
                        <i class="fas fa-lock mr-2 text-xs"></i>
                        Password
                    </label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="Masukkan password" 
                            class="w-full px-4 py-3 text-sm border border-gray-700 bg-gray-800/50 text-slate-300 placeholder-slate-500 focus:border-indigo-500 transition-colors duration-150 rounded-lg"
                            required
                            minlength="6"
                        >
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                    <div class="error-text" id="passwordError">Password minimal 6 karakter</div>
                </div>

                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center gap-3">
                        <input 
                            type="checkbox" 
                            id="rememberMe"
                        >
                        <label for="rememberMe" class="text-xs text-slate-400 cursor-pointer">
                            Ingat aku selama 30 hari
                        </label>
                    </div>
                    <a href="#" class="text-xs text-indigo-400 hover:text-indigo-300 transition-colors">
                        Lupa password?
                    </a>
                </div>

                <button 
                    type="submit" 
                    id="loginBtn"
                    class="btn-gradient w-full py-3.5 rounded-lg font-semibold text-white text-sm transition-all duration-300 flex items-center justify-center gap-2"
                >
                    <i class="fas fa-sign-in-alt text-sm"></i>
                    Masuk
                </button>
            </form>

            <p class="text-center text-sm text-slate-400 mt-6">
                Belum punya akun? 
                <a href="/register" class="text-indigo-400 hover:text-indigo-300 font-medium">Daftar di sini</a>
            </p>
        </div>

        <footer class="text-center mt-8">
            <p class="text-slate-500 text-xs">
                2025 Takanashi-API
            </p>
        </footer>

    </main>

    <script>
        // Toggle Password
        function togglePassword() {
            const password = document.getElementById('password');
            const icon = document.getElementById('toggleIcon');
            if (password.type === 'password') {
                password.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                password.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        // Notification functions
        function showNotification(username) {
            const notif = document.getElementById('notification');
            const message = document.getElementById('notifMessage');
            message.textContent = `Selamat datang kembali, ${username}!`;
            notif.classList.remove('hide', 'show');
            void notif.offsetWidth;
            notif.classList.add('show');
            clearTimeout(window.notifTimeout);
            window.notifTimeout = setTimeout(() => {
                closeNotification();
            }, 3000);
        }

        function closeNotification() {
            const notif = document.getElementById('notification');
            notif.classList.remove('show');
            notif.classList.add('hide');
        }

        // Load remembered username
        window.addEventListener('DOMContentLoaded', function() {
            const rememberMe = document.getElementById('rememberMe');
            const savedUsername = localStorage.getItem('rememberedUsername');
            if (savedUsername) {
                document.getElementById('usernameOrEmail').value = savedUsername;
                rememberMe.checked = true;
            }
        });

        // Login Form Submit
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            let isValid = true;

            document.querySelectorAll('.error-text').forEach(el => el.classList.remove('show'));
            document.querySelectorAll('input').forEach(el => el.classList.remove('error-input'));

            const usernameOrEmail = document.getElementById('usernameOrEmail');
            if (usernameOrEmail.value.trim() === '') {
                document.getElementById('usernameOrEmailError').classList.add('show');
                usernameOrEmail.classList.add('error-input');
                isValid = false;
            }

            const password = document.getElementById('password');
            if (password.value.length < 6) {
                document.getElementById('passwordError').classList.add('show');
                password.classList.add('error-input');
                isValid = false;
            }

            if (isValid) {
                const btn = document.getElementById('loginBtn');
                btn.innerHTML = '<div class="loader"></div>';
                btn.disabled = true;

                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            usernameOrEmail: usernameOrEmail.value.trim(),
                            password: password.value
                        })
                    });

                    const data = await response.json();

                    if (data.success) {
                        const rememberMe = document.getElementById('rememberMe');
                        if (rememberMe.checked) {
                            localStorage.setItem('rememberedUsername', usernameOrEmail.value.trim());
                            localStorage.setItem('rememberMeExpiry', Date.now() + 30 * 24 * 60 * 60 * 1000);
                        } else {
                            localStorage.removeItem('rememberedUsername');
                            localStorage.removeItem('rememberMeExpiry');
                        }

                        localStorage.setItem('userData', JSON.stringify(data.user));

                        showNotification(data.user.username);
                        
                        btn.innerHTML = `
                            <i class="fas fa-sign-in-alt text-sm"></i>
                            Masuk
                        `;
                        btn.disabled = false;
                        this.reset();
                        
                        setTimeout(() => {
                            window.location.href = '/dashboard';
                        }, 2000);
                    } else {
                        alert(data.error || 'Login gagal!');
                        btn.innerHTML = `
                            <i class="fas fa-sign-in-alt text-sm"></i>
                            Masuk
                        `;
                        btn.disabled = false;
                    }
                } catch (error) {
                    alert('Terjadi kesalahan! Silakan coba lagi.');
                    btn.innerHTML = `
                        <i class="fas fa-sign-in-alt text-sm"></i>
                        Masuk
                    `;
                    btn.disabled = false;
                }
            }
        });
    </script>
</body>
</html>
